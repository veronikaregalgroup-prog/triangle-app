<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>חוקרים משולשים </title>
  <style>
    :root {
      --bg-app: #f0f4f8;
      --bg-panel: #ffffff;
      --border-soft: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #475569;
      --color-a: #2563eb;
      --color-a-bg: #eff6ff;
      --color-a-border: #bfdbfe;
      --color-b: #dc2626;
      --color-b-bg: #fef2f2;
      --color-b-border: #fecaca;
      --color-c: #16a34a;
      --color-c-bg: #f0fdf4;
      --color-c-border: #bbf7d0;
    }

    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-app);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    .sidebar {
      width: 350px;
      min-width: 260px;
      max-width: 520px;
      background: var(--bg-panel);
      border-left: 1px solid #cbd5e1;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
      box-shadow: -4px 0 18px rgba(15, 23, 42, 0.06);
      z-index: 10;
      position: relative;
      transition: width 0.18s ease, padding 0.18s ease;
    }

    .sidebar.resizing {
      transition: none;
      user-select: none;
    }

    .sidebar.collapsed {
      width: 52px !important;
      min-width: 52px !important;
      padding: 14px 8px;
      overflow: hidden;
      align-items: center;
    }

    .sidebar.collapsed .sidebar-content {
      display: none;
    }

    .resizer-handle {
      position: absolute;
      top: 0;
      left: 0;
      width: 8px;
      height: 100%;
      cursor: ew-resize;
      background: transparent;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .resizer-handle:hover,
    .resizer-handle.active {
      background: rgba(37, 99, 235, 0.12);
    }

    .resizer-handle::after {
      content: "";
      width: 3px;
      height: 40px;
      background: #94a3b8;
      border-radius: 3px;
    }

    .sidebar.collapsed .resizer-handle {
      display: none;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 2px solid var(--border-soft);
      padding-bottom: 12px;
    }

    .sidebar.collapsed .sidebar-header {
      border-bottom: none;
      padding-bottom: 0;
      justify-content: center;
    }

    .title-wrap {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .sidebar h1 {
      font-size: 1.3rem;
      font-weight: 800;
      margin: 0;
      color: var(--text-main);
      white-space: nowrap;
    }

    .subtitle {
      font-size: 0.82rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .btn-toggle-sidebar {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      color: #334155;
      border-radius: 8px;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1rem;
      font-weight: bold;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.15s;
    }

    .btn-toggle-sidebar:hover {
      background: #e2e8f0;
    }

    .sidebar-content {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .instructions {
      font-size: 0.88rem;
      line-height: 1.55;
      color: #334155;
      background: #f8fafc;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border-soft);
    }

    .control-card {
      border-radius: 14px;
      padding: 13px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border: 1.5px solid var(--border-soft);
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.03);
    }

    .card-a {
      background: var(--color-a-bg);
      border-color: var(--color-a-border);
    }

    .card-b {
      background: var(--color-b-bg);
      border-color: var(--color-b-border);
    }

    .card-c {
      background: var(--color-c-bg);
      border-color: var(--color-c-border);
    }

    .control-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 800;
      font-size: 1rem;
    }

    .side-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
    }

    .dot-a { background: var(--color-a); }
    .dot-b { background: var(--color-b); }
    .dot-c { background: var(--color-c); }

    .label-a { color: var(--color-a); }
    .label-b { color: var(--color-b); }
    .label-c { color: var(--color-c); }

    .stepper-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-step {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      border: 1.5px solid rgba(15, 23, 42, 0.14);
      background: #ffffff;
      color: var(--text-main);
      font-size: 1.25rem;
      font-weight: 800;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
      transition: background 0.15s, transform 0.1s;
      user-select: none;
    }

    .btn-step:hover {
      background: #f1f5f9;
    }

    .btn-step:active {
      transform: scale(0.95);
    }

    input[type="range"] {
      flex: 1;
      min-width: 50px;
      height: 6px;
      border-radius: 999px;
      cursor: pointer;
    }

    #sliderA { accent-color: var(--color-a); }
    #sliderB { accent-color: var(--color-b); }
    #sliderC { accent-color: var(--color-c); }

    input[type="number"] {
      width: 64px;
      height: 34px;
      padding: 4px 6px;
      border: 1.5px solid #cbd5e1;
      border-radius: 9px;
      background: #ffffff;
      font-size: 1rem;
      font-weight: 800;
      text-align: center;
      color: var(--text-main);
    }

    input[type="number"]:focus {
      outline: none;
      border-color: #64748b;
    }

    .status-box {
      padding: 14px 15px;
      border-radius: 14px;
      font-size: 0.94rem;
      line-height: 1.55;
      font-weight: 700;
      text-align: center;
      border: 2px solid transparent;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
      transition: all 0.2s ease;
    }

    .status-valid {
      background: linear-gradient(135deg, #dcfce7 0%, #bbf7d0 100%);
      color: #14532d;
      border-color: #4ade80;
    }

    .status-degenerate {
      background: linear-gradient(135deg, #fef9c3 0%, #fef08a 100%);
      color: #713f12;
      border-color: #facc15;
    }

    .status-invalid {
      background: linear-gradient(135deg, #fee2e2 0%, #fecaca 100%);
      color: #7f1d1d;
      border-color: #f87171;
    }

    .btn-reset {
      padding: 12px 14px;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(15, 23, 42, 0.15);
      transition: opacity 0.15s, transform 0.1s;
    }

    .btn-reset:hover {
      opacity: 0.94;
    }

    .btn-reset:active {
      transform: scale(0.99);
    }

    .canvas-container {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #ffffff;
      min-width: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }

    canvas:active {
      cursor: grabbing;
    }
  </style>
</head>
<body>

  <aside class="sidebar" id="sidebar">
    <div class="resizer-handle" id="resizerHandle" title="גרירה לשינוי רוחב העמודה"></div>

    <div class="sidebar-header">
      <button class="btn-toggle-sidebar" id="btnToggleSidebar" title="כווץ / הרחב תפריט">❯</button>
      <div class="sidebar-content title-wrap" style="flex:1;">
        <h1>אי-שוויון המשולש</h1>
        <span class="subtitle">חקירת בניית משולש משלושה קטעים</span>
      </div>
    </div>

    <div class="sidebar-content">
      <div class="instructions">
        קבעו את אורך הצלעות בעזרת המחוונים, כפתורי <strong>+</strong> ו-<strong>−</strong> או תיבות המספרים.
        <br />
        סובבו כל צלע ב-360° על גבי הרשת בעזרת העיגולים שבקצותיהן מבלי לשנות את אורכן.
      </div>

      <div class="control-card card-a">
        <div class="control-header">
          <span class="side-badge label-a">
            <span class="dot dot-a"></span>
            צלע א' (בסיס)
          </span>
        </div>
        <div class="stepper-row">
          <button type="button" class="btn-step" data-side="a" data-delta="-0.5" title="הקטן">−</button>
          <input type="range" id="sliderA" min="1" max="15" step="0.5" value="6" />
          <button type="button" class="btn-step" data-side="a" data-delta="0.5" title="הגדל">+</button>
          <input type="number" id="numA" min="1" max="15" step="0.5" value="6" />
        </div>
      </div>

      <div class="control-card card-b">
        <div class="control-header">
          <span class="side-badge label-b">
            <span class="dot dot-b"></span>
            צלע ב' (שמאלית)
          </span>
        </div>
        <div class="stepper-row">
          <button type="button" class="btn-step" data-side="b" data-delta="-0.5" title="הקטן">−</button>
          <input type="range" id="sliderB" min="1" max="15" step="0.5" value="5" />
          <button type="button" class="btn-step" data-side="b" data-delta="0.5" title="הגדל">+</button>
          <input type="number" id="numB" min="1" max="15" step="0.5" value="5" />
        </div>
      </div>

      <div class="control-card card-c">
        <div class="control-header">
          <span class="side-badge label-c">
            <span class="dot dot-c"></span>
            צלע ג' (ימנית)
          </span>
        </div>
        <div class="stepper-row">
          <button type="button" class="btn-step" data-side="c" data-delta="-0.5" title="הקטן">−</button>
          <input type="range" id="sliderC" min="1" max="15" step="0.5" value="4" />
          <button type="button" class="btn-step" data-side="c" data-delta="0.5" title="הגדל">+</button>
          <input type="number" id="numC" min="1" max="15" step="0.5" value="4" />
        </div>
      </div>

      <div id="statusBox" class="status-box status-valid">
        ניתן לבנות משולש סגור ותקין!
      </div>

      <button type="button" class="btn-reset" id="btnSnap">הצג מצב התחלתי / סגור משולש</button>
    </div>
  </aside>

  <main class="canvas-container">
    <canvas id="geoCanvas"></canvas>
  </main>

  <script>
    const sidebar = document.getElementById('sidebar');
    const resizerHandle = document.getElementById('resizerHandle');
    const btnToggleSidebar = document.getElementById('btnToggleSidebar');

    const canvas = document.getElementById('geoCanvas');
    const ctx = canvas.getContext('2d');

    const sliderA = document.getElementById('sliderA');
    const numA = document.getElementById('numA');
    const sliderB = document.getElementById('sliderB');
    const numB = document.getElementById('numB');
    const sliderC = document.getElementById('sliderC');
    const numC = document.getElementById('numC');
    const statusBox = document.getElementById('statusBox');
    const btnSnap = document.getElementById('btnSnap');

    let a = 6;
    let b = 5;
    let c = 4;

    let angleB = 0;
    let angleC = Math.PI;
    let draggingHandle = null;
    let gridSize = 42;

    const COLORS = {
      a: '#2563eb',
      b: '#dc2626',
      c: '#16a34a',
      grid: '#e2e8f0',
      gridMajor: '#cbd5e1',
      fillValid: 'rgba(37, 99, 235, 0.11)',
      fillStroke: 'rgba(37, 99, 235, 0.25)'
    };

    btnToggleSidebar.addEventListener('click', () => {
      sidebar.classList.toggle('collapsed');
      const isCollapsed = sidebar.classList.contains('collapsed');
      btnToggleSidebar.textContent = isCollapsed ? '❮' : '❯';
      btnToggleSidebar.title = isCollapsed ? 'הרחב תפריט' : 'כווץ תפריט';
      resizeCanvas();
    });

    let isResizingSidebar = false;

    resizerHandle.addEventListener('mousedown', (e) => {
      e.preventDefault();
      isResizingSidebar = true;
      sidebar.classList.add('resizing');
      resizerHandle.classList.add('active');
    });

    window.addEventListener('mousemove', (e) => {
      if (!isResizingSidebar) return;
      const newWidth = window.innerWidth - e.clientX;
      const clampedWidth = Math.max(260, Math.min(520, newWidth));
      sidebar.style.width = `${clampedWidth}px`;
      resizeCanvas();
    });

    window.addEventListener('mouseup', () => {
      if (isResizingSidebar) {
        isResizingSidebar = false;
        sidebar.classList.remove('resizing');
        resizerHandle.classList.remove('active');
        resizeCanvas();
      }
    });

    function computeViewportMetrics() {
      const width = canvas.parentElement.clientWidth;
      const height = canvas.parentElement.clientHeight;

      const minXUnits = Math.min(-a / 2 - b, a / 2 - c);
      const maxXUnits = Math.max(a / 2 + c, -a / 2 + b);
      const totalWidthUnits = maxXUnits - minXUnits;

      const maxRadiusUnits = Math.max(b, c, 1);
      const totalHeightUnits = 2 * maxRadiusUnits;

      const paddingPx = 48;
      const availWidth = Math.max(120, width - paddingPx * 2);
      const availHeight = Math.max(120, height - paddingPx * 2);

      const scaleX = availWidth / totalWidthUnits;
      const scaleY = availHeight / totalHeightUnits;

      gridSize = Math.max(10, Math.min(56, scaleX, scaleY));

      const centerUnitsX = (minXUnits + maxXUnits) / 2;
      const originX = width / 2 - centerUnitsX * gridSize;
      const baseY = height / 2;

      const leftX = originX - (a / 2) * gridSize;
      const rightX = originX + (a / 2) * gridSize;

      return { width, height, leftX, rightX, baseY, originX };
    }

    function resizeCanvas() {
      const container = canvas.parentElement;
      const dpr = window.devicePixelRatio || 1;
      canvas.width = container.clientWidth * dpr;
      canvas.height = container.clientHeight * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      draw();
    }

    window.addEventListener('resize', resizeCanvas);

    function getTriangleState(a, b, c) {
      const eps = 1e-6;
      const sumAB = a + b;
      const sumAC = a + c;
      const sumBC = b + c;

      if (
        Math.abs(sumAB - c) < eps ||
        Math.abs(sumAC - b) < eps ||
        Math.abs(sumBC - a) < eps
      ) {
        return 'degenerate';
      }

      if (sumAB > c && sumAC > b && sumBC > a) {
        return 'valid';
      }

      return 'invalid';
    }

    function resetAnglesToDefault() {
      const state = getTriangleState(a, b, c);

      if (state === 'valid') {
        const cosB = (a * a + b * b - c * c) / (2 * a * b);
        const clampedCosB = Math.max(-1, Math.min(1, cosB));
        const thetaB = Math.acos(clampedCosB);

        angleB = -thetaB;

        const tipBx = b * Math.cos(angleB);
        const tipBy = b * Math.sin(angleB);
        angleC = Math.atan2(tipBy - 0, tipBx - a);
      } else if (state === 'degenerate') {
        if (Math.abs((b + c) - a) < 1e-6) {
          angleB = 0;
          angleC = Math.PI;
        } else if (Math.abs((a + c) - b) < 1e-6) {
          angleB = 0;
          angleC = 0;
        } else {
          angleB = Math.PI;
          angleC = Math.PI;
        }
      } else {
        angleB = -Math.PI / 3;
        angleC = -2 * Math.PI / 3;
      }
    }

    function updateStatusUI() {
      const state = getTriangleState(a, b, c);
      statusBox.className = 'status-box';

      if (state === 'valid') {
        statusBox.classList.add('status-valid');
        statusBox.textContent = 'ניתן לבנות משולש סגור ותקין! גררו את קצות הצלעות כדי לסובב כל צלע ב-360°.';
      } else if (state === 'degenerate') {
        statusBox.classList.add('status-degenerate');
        statusBox.textContent = 'סכום שתי צלעות שווה לצלע השלישית: הקטעים מתלכדים לקו ישר (משולש מנוון).';
      } else {
        statusBox.classList.add('status-invalid');
        statusBox.textContent = 'הצורה אינה נסגרת למשולש. סובבו את הקטעים ב-360° כדי לבדוק מדוע אינם נפגשים.';
      }
    }

    function syncInputs(source, value) {
      const parsed = parseFloat(value);
      const clamped = Math.max(1, Math.min(15, isNaN(parsed) ? 1 : parsed));
      const val = Math.round(clamped * 2) / 2;

      if (source === 'a') {
        a = val;
        sliderA.value = val;
        numA.value = val;
      } else if (source === 'b') {
        b = val;
        sliderB.value = val;
        numB.value = val;
      } else if (source === 'c') {
        c = val;
        sliderC.value = val;
        numC.value = val;
      }

      resetAnglesToDefault();
      updateStatusUI();
      draw();
    }

    document.querySelectorAll('.btn-step').forEach((btn) => {
      btn.addEventListener('click', () => {
        const side = btn.dataset.side;
        const delta = parseFloat(btn.dataset.delta);
        const current = side === 'a' ? a : side === 'b' ? b : c;
        syncInputs(side, current + delta);
      });
    });

    sliderA.addEventListener('input', (e) => syncInputs('a', e.target.value));
    numA.addEventListener('input', (e) => syncInputs('a', e.target.value));
    sliderB.addEventListener('input', (e) => syncInputs('b', e.target.value));
    numB.addEventListener('input', (e) => syncInputs('b', e.target.value));
    sliderC.addEventListener('input', (e) => syncInputs('c', e.target.value));
    numC.addEventListener('input', (e) => syncInputs('c', e.target.value));

    btnSnap.addEventListener('click', () => {
      resetAnglesToDefault();
      draw();
    });

    function drawGrid(width, height, leftX, baseY) {
      ctx.clearRect(0, 0, width, height);

      const startX = ((leftX % gridSize) + gridSize) % gridSize;
      const startY = ((baseY % gridSize) + gridSize) % gridSize;

      ctx.lineWidth = 1;
      for (let x = startX; x <= width; x += gridSize) {
        const unitIndex = Math.round((x - leftX) / gridSize);
        ctx.strokeStyle = (unitIndex % 5 === 0) ? COLORS.gridMajor : COLORS.grid;
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, height);
        ctx.stroke();
      }

      for (let y = startY; y <= height; y += gridSize) {
        const unitIndex = Math.round((y - baseY) / gridSize);
        ctx.strokeStyle = (unitIndex % 5 === 0) ? COLORS.gridMajor : COLORS.grid;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
        ctx.stroke();
      }
    }

    function drawDashedCircle(cx, cy, radiusPx, color) {
      ctx.save();
      ctx.beginPath();
      ctx.setLineDash([7, 6]);
      ctx.strokeStyle = color;
      ctx.globalAlpha = 0.42;
      ctx.lineWidth = 2;
      ctx.arc(cx, cy, radiusPx, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    function drawSideLabel(text, x1, y1, x2, y2, color, offsetSign = -1) {
      const midX = (x1 + x2) / 2;
      const midY = (y1 + y2) / 2;

      const dx = x2 - x1;
      const dy = y2 - y1;
      const len = Math.hypot(dx, dy) || 1;

      const nx = (-dy / len) * 22 * offsetSign;
      const ny = (dx / len) * 22 * offsetSign;

      const labelX = midX + nx;
      const labelY = midY + ny;

      ctx.save();
      ctx.font = '800 16px Segoe UI, sans-serif';
      const textWidth = ctx.measureText(text).width;
      const pillW = textWidth + 14;
      const pillH = 26;

      ctx.fillStyle = 'rgba(255, 255, 255, 0.94)';
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect(labelX - pillW / 2, labelY - pillH / 2, pillW, pillH, 8);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = color;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, labelX, labelY + 0.5);
      ctx.restore();
    }

    function drawPoint(x, y, color, isHandle = false) {
      ctx.save();
      if (isHandle) {
        ctx.beginPath();
        ctx.arc(x, y, 13, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.globalAlpha = 0.14;
        ctx.fill();
        ctx.globalAlpha = 1;
      }

      ctx.beginPath();
      ctx.arc(x, y, isHandle ? 8.5 : 6, 0, Math.PI * 2);
      ctx.fillStyle = isHandle ? '#ffffff' : color;
      ctx.fill();
      ctx.lineWidth = 3.2;
      ctx.strokeStyle = color;
      ctx.stroke();
      ctx.restore();
    }

    function draw() {
      const { width, height, leftX, rightX, baseY } = computeViewportMetrics();
      drawGrid(width, height, leftX, baseY);

      const radiusB = b * gridSize;
      const radiusC = c * gridSize;

      const tipBx = leftX + radiusB * Math.cos(angleB);
      const tipBy = baseY + radiusB * Math.sin(angleB);

      const tipCx = rightX + radiusC * Math.cos(angleC);
      const tipCy = baseY + radiusC * Math.sin(angleC);

      const distTips = Math.hypot(tipBx - tipCx, tipBy - tipCy);
      const state = getTriangleState(a, b, c);
      const isClosedTriangle = state === 'valid' && distTips < 3;

      if (isClosedTriangle) {
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(leftX, baseY);
        ctx.lineTo(rightX, baseY);
        ctx.lineTo(tipBx, tipBy);
        ctx.closePath();
        ctx.fillStyle = COLORS.fillValid;
        ctx.fill();
        ctx.restore();
      }

      drawDashedCircle(leftX, baseY, radiusB, COLORS.b);
      drawDashedCircle(rightX, baseY, radiusC, COLORS.c);

      ctx.save();
      ctx.beginPath();
      ctx.moveTo(leftX, baseY);
      ctx.lineTo(rightX, baseY);
      ctx.strokeStyle = COLORS.a;
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';
      ctx.stroke();
      ctx.restore();

      ctx.save();
      ctx.beginPath();
      ctx.moveTo(leftX, baseY);
      ctx.lineTo(tipBx, tipBy);
      ctx.strokeStyle = COLORS.b;
      ctx.lineWidth = 5.5;
      ctx.lineCap = 'round';
      ctx.stroke();
      ctx.restore();

      ctx.save();
      ctx.beginPath();
      ctx.moveTo(rightX, baseY);
      ctx.lineTo(tipCx, tipCy);
      ctx.strokeStyle = COLORS.c;
      ctx.lineWidth = 5.5;
      ctx.lineCap = 'round';
      ctx.stroke();
      ctx.restore();

      drawSideLabel(`${a}`, leftX, baseY, rightX, baseY, COLORS.a, -1);
      drawSideLabel(`${b}`, leftX, baseY, tipBx, tipBy, COLORS.b, 1);
      drawSideLabel(`${c}`, rightX, baseY, tipCx, tipCy, COLORS.c, -1);

      drawPoint(leftX, baseY, COLORS.a, false);
      drawPoint(rightX, baseY, COLORS.a, false);
      drawPoint(tipBx, tipBy, COLORS.b, true);
      drawPoint(tipCx, tipCy, COLORS.c, true);
    }

    function getMousePos(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: e.clientX - rect.left,
        y: e.clientY - rect.top
      };
    }

    canvas.addEventListener('mousedown', (e) => {
      const pos = getMousePos(e);
      const { leftX, rightX, baseY } = computeViewportMetrics();

      const tipBx = leftX + b * gridSize * Math.cos(angleB);
      const tipBy = baseY + b * gridSize * Math.sin(angleB);

      const tipCx = rightX + c * gridSize * Math.cos(angleC);
      const tipCy = baseY + c * gridSize * Math.sin(angleC);

      const distB = Math.hypot(pos.x - tipBx, pos.y - tipBy);
      const distC = Math.hypot(pos.x - tipCx, pos.y - tipCy);

      const hitRadius = 20;

      if (distB <= hitRadius && distB <= distC) {
        draggingHandle = 'B';
      } else if (distC <= hitRadius) {
        draggingHandle = 'C';
      }
    });

    window.addEventListener('mousemove', (e) => {
      if (!draggingHandle) return;

      const pos = getMousePos(e);
      const { leftX, rightX, baseY } = computeViewportMetrics();

      if (draggingHandle === 'B') {
        angleB = Math.atan2(pos.y - baseY, pos.x - leftX);
      } else if (draggingHandle === 'C') {
        angleC = Math.atan2(pos.y - baseY, pos.x - rightX);
      }

      draw();
    });

    window.addEventListener('mouseup', () => {
      draggingHandle = null;
    });

    canvas.addEventListener('touchstart', (e) => {
      if (e.touches.length > 0) {
        const touch = e.touches[0];
        canvas.dispatchEvent(new MouseEvent('mousedown', {
          clientX: touch.clientX,
          clientY: touch.clientY
        }));
      }
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (draggingHandle && e.touches.length > 0) {
        const touch = e.touches[0];
        window.dispatchEvent(new MouseEvent('mousemove', {
          clientX: touch.clientX,
          clientY: touch.clientY
        }));
      }
    }, { passive: true });

    window.addEventListener('touchend', () => {
      draggingHandle = null;
    });

    resetAnglesToDefault();
    updateStatusUI();
    resizeCanvas();
  </script>
</body>
</html>
